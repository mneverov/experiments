# Rendered by run-experiment.sh with envsubst, once per app (a, b).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memtest-${APP}
  namespace: memtest
  labels:
    app.kubernetes.io/name: memtest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memtest
      app.kubernetes.io/instance: "${APP}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memtest
        app.kubernetes.io/instance: "${APP}"
    spec:
      nodeSelector:
        role: apps
      terminationGracePeriodSeconds: 1
      containers:
      - name: memtest
        image: memtest:dev
        imagePullPolicy: Never
        args:
        - --experiment=${EXPERIMENT}
        - --base-mib=${BASE_MIB}
        - --spike-mib=${SPIKE_MIB}
        - --spike-after=${SPIKE_AFTER}
        - --spike-for=${SPIKE_FOR}
        - --free-os-memory-every=${FREE_OS_MEMORY_EVERY}
        env:
        - name: GODEBUG
          value: "${APP_GODEBUG}"
        - name: GOMEMLIMIT
          value: "${APP_GOMEMLIMIT}"
        resources:
          requests:
            memory: 250Mi
          limits:
            memory: 850Mi
        ports:
        - name: metrics
          containerPort: 6060
