# Rendered by run-experiments.sh with envsubst, once per run and app (a, b).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RUN}-${APP}
  namespace: memtest
  labels:
    app.kubernetes.io/name: memtest
    memtest/run: "${RUN}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memtest
      memtest/run: "${RUN}"
      app.kubernetes.io/instance: "${APP}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memtest
        memtest/run: "${RUN}"
        app.kubernetes.io/instance: "${APP}"
    spec:
      nodeSelector:
        kubernetes.io/hostname: "${NODE}"
      terminationGracePeriodSeconds: 1
      containers:
      - name: memtest
        image: memtest:dev
        imagePullPolicy: Never
        args:
        - --experiment=${RUN}
        - --base-mib=${BASE_MIB}
        - --spike-mib=${SPIKE_MIB}
        - --spike-after=${SPIKE_AFTER}
        - --spike-for=${SPIKE_FOR}
        - --free-os-memory-every=${FREE_OS_MEMORY_EVERY}
        - --churn-mib-per-sec=${CHURN_MIB_PER_SEC}
        env:
        - name: GODEBUG
          value: "${APP_GODEBUG}"
        - name: GOMEMLIMIT
          value: "${APP_GOMEMLIMIT}"
        resources:
          requests:
            memory: 250Mi
          limits:
            memory: 850Mi
        ports:
        - name: metrics
          containerPort: 6060
